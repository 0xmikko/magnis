name: Main promotion gate

on:
  # Run the workflow definition from the trusted base branch. A pull request
  # must not be able to edit or bypass the check that guards main.
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  staging-only:
    name: staging-only
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Require same-repository staging promotion
        run: bun scripts/main-promotion-policy.ts "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY"
