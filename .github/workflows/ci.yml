name: CI
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - name: Typecheck (modules + sources + packages + scripts)
        run: bun run typecheck
      - name: Lint (strict eslint, zero warnings)
        run: bun run lint
      - name: Module + SDK tests
        run: bun run test
      - name: Runtime artifact contract tests
        run: bun run test:runtime-contracts
      - name: Plugin UI tests
        run: bun run test:ui
      - name: Connector tests
        run: bun run test:connectors
      - name: Tooling tests
        run: bun run test:scripts
      - name: Bundle smoke
        run: bun run build:plugins

# The channel the app actually reads. Two of them, and which one a build
# takes is a launch key: a release build reads `catalog`, a development
# build reads `catalog-staging`, and an explicit MAGNIS_CATALOG_URL beats
# both. So `staging` gets its own published channel rather than being
# tested against whatever a developer happens to have checked out.
#
# RELEASES rather than a branch: release assets are fetched anonymously
# over a stable URL with no API and no token, which is the one property
# the desktop app cannot do without (a token cannot ship in a DMG).
# The tag NAMES the channel — never `latest`, because this repository
# also publishes desktop builds as releases and `latest` would silently
# become whichever went out last.
  catalog:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    needs: [typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-plugins.ts
      - run: bun scripts/build-catalog-index.ts
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Publish the channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then TAG=catalog; else TAG=catalog-staging; fi
          # Every asset is replaced, so a package withdrawn from the catalog
          # stops being served instead of lingering as an orphan a stale
          # index no longer mentions.
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" \
            --title "Plugin catalog (${TAG})" \
            --notes "Built from ${GITHUB_SHA}. Fetched anonymously by the Magnis app." \
            catalog/index.json catalog/index.v2.json catalog/onboarding.json \
            catalog/receipts/*.json catalog/*.tgz
