name: Desktop runtime candidate

# A runtime archive is a release input, not a branch default. This workflow is
# deliberately dispatched with one version/target/SHA-256 tuple and refuses to
# infer any of them. Once this passes for a published release, a separate PR
# may add that exact tuple to runtime.staging.lock.json.
on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Immutable runtime semantic version
        required: true
        type: string
      runtime_target:
        description: Target declared by the immutable runtime reference
        required: true
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
      runtime_sha256:
        description: Archive SHA-256 copied from the immutable runtime reference
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-platform:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.target.outputs.runner }}
      bundle_targets: ${{ steps.target.outputs.bundle_targets }}
    steps:
      - id: target
        env:
          TARGET: ${{ inputs.runtime_target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            x86_64-unknown-linux-gnu)
              echo 'runner=ubuntu-latest' >> "$GITHUB_OUTPUT"
              echo 'bundle_targets=appimage,deb' >> "$GITHUB_OUTPUT"
              ;;
            aarch64-unknown-linux-gnu)
              echo 'runner=ubuntu-24.04-arm' >> "$GITHUB_OUTPUT"
              echo 'bundle_targets=appimage,deb' >> "$GITHUB_OUTPUT"
              ;;
            x86_64-apple-darwin)
              echo 'runner=macos-13' >> "$GITHUB_OUTPUT"
              echo 'bundle_targets=app' >> "$GITHUB_OUTPUT"
              ;;
            aarch64-apple-darwin)
              echo 'runner=macos-14' >> "$GITHUB_OUTPUT"
              echo 'bundle_targets=app' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported runtime target: $TARGET" >&2
              exit 1
              ;;
          esac

  package:
    needs: resolve-platform
    runs-on: ${{ needs.resolve-platform.outputs.runner }}
    env:
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      RUNTIME_TARGET: ${{ inputs.runtime_target }}
      RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
      BUNDLE_TARGETS: ${{ needs.resolve-platform.outputs.bundle_targets }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      - name: Install public build dependencies
        run: bun install --frozen-lockfile

      - name: Download the exact runtime input
        run: |
          set -euo pipefail
          runtime_input="$RUNNER_TEMP/magnis-runtime-input"
          bun apps/desktop/build/download-runtime.ts \
            --version "$RUNTIME_VERSION" \
            --target "$RUNTIME_TARGET" \
            --sha256 "$RUNTIME_SHA256" \
            --out-dir "$runtime_input"
          echo "MAGNIS_RUNTIME_ARCHIVE=$runtime_input/magnis-runtime-v${RUNTIME_VERSION}-${RUNTIME_TARGET}.tar.gz" >> "$GITHUB_ENV"
          echo "MAGNIS_RUNTIME_REF=$runtime_input/magnis-runtime-v${RUNTIME_VERSION}-${RUNTIME_TARGET}.ref.json" >> "$GITHUB_ENV"
          echo "MAGNIS_RUNTIME_TARGET=$RUNTIME_TARGET" >> "$GITHUB_ENV"

      - name: Public TypeScript gate
        run: bun run check

      - name: Stage and verify the exact runtime
        run: bun apps/desktop/build/stage-runtime.ts

      - name: Desktop Rust gate
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.2.6 --locked

      - name: Produce unsigned desktop package
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles "$BUNDLE_TARGETS"

      - name: Require an unsigned package output
        run: |
          set -euo pipefail
          test -n "$(find apps/desktop/src-tauri/target/release/bundle -type f -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-${{ inputs.runtime_target }}-${{ inputs.runtime_version }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
