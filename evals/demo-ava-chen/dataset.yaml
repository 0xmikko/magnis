        tool_call_id: item_3
        tool_args: null
        tool_result: '{"tools":[{"name":"telegram.search","description":"Search Telegram messages or chats with domain filters. Use chat_type:''private'' for personal dialogs (DMs) — the right tool for ''who did I meet / personal outreach'' questions. Filters AND-compose: chat_type, participant (person id — both sides of the conversation), sender (person id — author only), linked_to (any entity id), date_after/date_before (RFC3339), query (text/semantic). Bounded: max 50 items; page with the returned next_cursor (same filters). In query mode total/has_more reflect a bounded scan, not an exact global count, and there is no cursor — refine the query or narrow dates. For deep graph traversal use graph.links; for cross-module search use graph.search.","params":{"type":"object","properties":{"target":{"type":"string","enum":["messages","chats"],"description":"What to return. Default: messages"},"chat_type":{"type":"string","enum":["private","group","supergroup","channel"],"description":"Chat kind. ''private'' = DM (1-on-1)"},"query":{"type":"string","description":"Text/semantic search over message content"},"participant":{"type":"string","description":"contacts.person entity id — conversation filter: messages in chats linked to this person (BOTH sides of the DM), or chats with this person"},"sender":{"type":"string","description":"contacts.person entity id — author filter: only messages SENT BY this person"},"linked_to":{"type":"string","description":"Any entity id (person/project/company/…) — only telegram entities linked to it, either direction"},"date_after":{"type":"string","description":"RFC3339 lower bound (inclusive)"},"date_before":{"type":"string","description":"RFC3339 upper bound (inclusive)"},"limit":{"type":"integer","minimum":1,"maximum":50,"description":"Default 25, hard cap 50"},"cursor":{"type":"string","description":"Opaque pagination cursor from the previous response''s next_cursor. Repeat the SAME filters"}},"additionalProperties":false}},{"name":"telegram.batch_send","description":"Send Telegram messages to multiple recipients in one batch (1..50). Each message needs chat_id and text; reply_to_message_id is optional. ALWAYS include chat_name — the recipient''s human display name (e.g. \"Dylan Dewdney\") — so the approval card shows who each message goes to instead of a raw chat_id. Use this for multi-recipient outreach so the user reviews ONE approval instead of N separate sends. Returns per-recipient results.","params":{"type":"object","properties":{"messages":{"type":"array","items":{"type":"object","properties":{"chat_id":{"type":["integer","string"]},"text":{"type":"string"},"reply_to_message_id":{"type":"integer"},"chat_name":{"type":"string"}},"required":["chat_id","text"],"additionalProperties":false},"minItems":1,"maxItems":50},"account_id":{"type":"string"}},"required":["messages"],"additionalProperties":false}},{"name":"telegram.chats.list","description":"List telegram chats (pinned first, then by last-message time desc). Optional name search.","params":{"type":"object","properties":{"limit":{"type":"integer","minimum":1},"offset":{"type":"integer","minimum":0},"search":{"type":"string"}},"additionalProperties":false}},{"name":"telegram.messages.get","description":"Get a single telegram message detail by entity id.","params":{"type":"object","properties":{"id":{"type":"string","format":"uuid"}},"required":["id"],"additionalProperties":false}},{"name":"telegram.messages.list","description":"List telegram messages, newest first. Filter by chat_id (or entity_id of the chat); omit to list all.","params":{"type":"object","properties":{"chat_id":{"type":["integer","string"]},"entity_id":{"type":"string","format":"uuid"},"limit":{"type":"integer","minimum":1,"maximum":50},"offset":{"type":"integer","minimum":0}},"additionalProperties":false}},{"name":"telegram.messages.reply","description":"Reply to a specific Telegram message in a chat. May require approval before execution.","params":{"type":"object","properties":{"chat_id":{"type":["integer","string"]},"reply_to_message_id":{"type":"integer"},"text":{"type":"string"},"account_id":{"type":"string"}},"required":["chat_id","reply_to_message_id","text"],"additionalProperties":false}},{"name":"telegram.messages.send","description":"Send a Telegram message to a chat. May require approval before execution.","params":{"type":"object","properties":{"chat_id":{"type":["integer","string"]},"text":{"type":"string"},"reply_to_message_id":{"type":"integer"},"account_id":{"type":"string"}},"required":["chat_id","text"],"additionalProperties":false}},{"name":"telegram.set_trigger","description":"Set up an automated reaction to incoming Telegram messages in a chat. When a matching message arrives, the action executes automatically.","params":{"type":"object","properties":{"chat_id":{"type":"integer","description":"Telegram chat ID to watch"},"gate_prompt":{"type":"string","description":"Condition to check on incoming message"},"action_prompt":{"type":"string","description":"What to do when the condition matches"},"debounce_seconds":{"type":"integer","description":"0=immediate (default), >0=batch within window"},"episode_id":{"type":"string","format":"uuid","description":"Parent episode for context"}},"required":["chat_id","gate_prompt","action_prompt"],"additionalProperties":false}}]}'
