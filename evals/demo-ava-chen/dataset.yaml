        tool_result: '{"tools":[{"name":"contacts.batch_create","description":"Create multiple contacts at once. Each requires a name, with optional email, phone, company, role. Pass client_id (UUID) as a batch idempotency key.","params":{"type":"object","properties":{"contacts":{"type":"array","items":{"type":"object","properties":{"name":{"type":"string"},"email":{"type":"string"},"phone":{"type":"string"},"company":{"type":"string"},"role":{"type":"string"}},"required":["name"],"additionalProperties":false},"minItems":1,"maxItems":50},"excluded_indices":{"type":"array","items":{"type":"integer","minimum":0}}},"required":["contacts"],"additionalProperties":false}},{"name":"contacts.batch_track_social","description":"Track MANY X or LinkedIn profiles at once from pasted URLs/handles (1-50). Each becomes a contact (found or created) with tracking ON. COST WARNING: every tracked handle is fetched on every sync cycle and costs paid API credits — confirm large batches with the operator first.","params":{"type":"object","properties":{"platform":{"type":"string","enum":["x","linkedin"]},"profiles":{"type":"array","minItems":1,"maxItems":50,"items":{"type":"object","properties":{"url_or_handle":{"type":"string"},"name":{"type":"string"}},"required":["url_or_handle"],"additionalProperties":false}},"excluded_indices":{"type":"array","items":{"type":"integer","minimum":0}}},"required":["platform","profiles"],"additionalProperties":false}},{"name":"contacts.create","description":"Create a new contact (person). Returns the created entity with id. Pass client_id (UUID) as an idempotency key — if a contact already exists with that id, the existing one is returned instead of a duplicate.","params":{"type":"object","properties":{"name":{"type":"string"},"email":{"type":"string"},"phone":{"type":"string"},"company":{"type":"string"},"role":{"type":"string"}},"required":["name"],"additionalProperties":false}},{"name":"contacts.get","description":"Get a full contact detail view (canonical, facets, links) by id.","params":{"type":"object","properties":{"id":{"type":"string","format":"uuid"}},"required":["id"],"additionalProperties":false}},{"name":"contacts.get_social_tracking","description":"Get a contact''s social-tracking opt-in state (X / LinkedIn) and handles.","params":{"type":"object","properties":{"id":{"type":"string","format":"uuid"}},"required":["id"],"additionalProperties":false}},{"name":"contacts.get_social_tracking_by_handle","description":"Resolve which contact tracks a given X / LinkedIn handle and whether tracking is currently on. Case-insensitive. Returns null when no contact has the handle.","params":{"type":"object","properties":{"platform":{"type":"string","enum":["x","linkedin"]},"handle":{"type":"string"}},"required":["platform","handle"],"additionalProperties":false}},{"name":"contacts.list","description":"List contacts with pagination and optional name search. By default, Telegram group-only co-members (relevance_tier ''group'') are hidden; pass include_all: true to show every contact.","params":{"type":"object","properties":{"limit":{"type":"integer","minimum":1},"offset":{"type":"integer","minimum":0},"search":{"type":"string"},"include_all":{"type":"boolean"}},"additionalProperties":false}},{"name":"contacts.list_social_tracking","description":"List every contact with social tracking ON for a platform (X / LinkedIn): contact id, name and tracked handle. Feeds pending ''Syncing'' rows in the platform modules.","params":{"type":"object","properties":{"platform":{"type":"string","enum":["x","linkedin"]}},"required":["platform"],"additionalProperties":false}},{"name":"contacts.merge","description":"Merge two contacts into one. Transfers all facets, links, and history from retired to survivor, then deletes retired.","params":{"type":"object","properties":{"survivor_id":{"type":"string","format":"uuid"},"retired_id":{"type":"string","format":"uuid"},"overrides":{"type":"array","items":{"type":"object","properties":{"canonical_key":{"type":"string"},"value":{"type":["string","number","boolean","null"]}},"required":["canonical_key","value"]}},"reason":{"type":"string"}},"required":["survivor_id","retired_id"],"additionalProperties":false}},{"name":"contacts.merge_preview","description":"Preview merging two contacts: which facets/links move and which fields conflict.","params":{"type":"object","properties":{"survivor_id":{"type":"string","format":"uuid"},"retired_id":{"type":"string","format":"uuid"}},"required":["survivor_id","retired_id"],"additionalProperties":false}},{"name":"contacts.search","description":"Search contacts by name.","params":{"type":"object","properties":{"query":{"type":"string"},"context":{"type":"string"},"limit":{"type":"integer","minimum":1}},"additionalProperties":false}},{"name":"contacts.set_social_tracking","description":"Opt a contact in or out of social tracking on X or LinkedIn. Only tracked handles are fetched by the social source connectors. Optionally set the handle.","params":{"type":"object","properties":{"id":{"type":"string","format":"uuid"},"platform":{"type":"string","enum":["x","linkedin"]},"tracked":{"type":"boolean"},"handle":{"type":"string"}},"required":["id","platform","tracked"],"additionalProperties":false}},{"name":"contacts.track_social_profile","description":"Track a person''s X or LinkedIn profile from a URL or handle. Finds the contact that already owns the handle (or creates one) and turns tracking ON. NOTE: every tracked handle costs paid API calls on each sync cycle.","params":{"type":"object","properties":{"platform":{"type":"string","enum":["x","linkedin"]},"url_or_handle":{"type":"string"},"name":{"type":"string"}},"required":["platform","url_or_handle"],"additionalProperties":false}},{"name":"contacts.update","description":"Update a contact''s name.","params":{"type":"object","properties":{"id":{"type":"string","format":"uuid"},"name":{"type":"string"}},"required":["id"],"additionalProperties":false}}]}'
