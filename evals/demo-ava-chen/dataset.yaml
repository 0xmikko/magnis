        tool_result: '{"tools":[{"name":"email.batch","description":"Get multiple email message detail views by entity ids.","params":{"type":"object","properties":{"ids":{"type":"array","items":{"type":"string","format":"uuid"}}},"required":["ids"],"additionalProperties":false}},{"name":"email.batch_send","description":"Send multiple emails in one batch (1..50). Each message needs to, subject, body_text. excluded_indices skip specific messages. Returns per-message results.","params":{"type":"object","properties":{"messages":{"type":"array","items":{"type":"object","properties":{"to":{"type":"string"},"subject":{"type":"string"},"body_text":{"type":"string"},"attachment_ids":{"type":"array","items":{"type":"string","format":"uuid"}}},"required":["to","subject","body_text"],"additionalProperties":false},"minItems":1,"maxItems":50},"excluded_indices":{"type":"array","items":{"type":"integer","minimum":0}}},"required":["messages"],"additionalProperties":false}},{"name":"email.get","description":"Get a single email message detail view by entity id.","params":{"type":"object","properties":{"id":{"type":"string","format":"uuid"}},"required":["id"],"additionalProperties":false}},{"name":"email.list","description":"List email messages, newest first. Optional name search.","params":{"type":"object","properties":{"limit":{"type":"integer","minimum":1},"offset":{"type":"integer","minimum":0},"search":{"type":"string"}},"additionalProperties":false}},{"name":"email.reply","description":"Reply to an email. Reads the original, threads the reply (In-Reply-To), and routes it for sending. Optionally attach files by entity ID.","params":{"type":"object","properties":{"email_id":{"type":"string","format":"uuid","description":"Entity ID of the email to reply to"},"body_text":{"type":"string","description":"Plain text body of the reply"},"attachment_ids":{"type":"array","items":{"type":"string","format":"uuid"},"description":"File entity IDs to attach"}},"required":["email_id","body_text"],"additionalProperties":false}},{"name":"email.send","description":"Send a new email to a recipient. Subject and body required. Optionally attach files by entity ID.","params":{"type":"object","properties":{"to":{"type":"string","description":"Recipient email address"},"subject":{"type":"string"},"body_text":{"type":"string"},"attachment_ids":{"type":"array","items":{"type":"string","format":"uuid"},"description":"File entity IDs to attach"}},"required":["to","subject","body_text"],"additionalProperties":false}},{"name":"email.set_trigger","description":"Set up an automated reaction to incoming emails. Watches one or more email addresses (OR-matching). When any watched address receives an email matching the gate, the action runs.","params":{"type":"object","properties":{"from_addresses":{"type":"array","items":{"type":"string"},"description":"Email addresses to watch (OR-matching: fires for ANY)"},"from_address":{"type":"string","description":"Single address (legacy; prefer from_addresses)"},"gate_prompt":{"type":"string","description":"Condition to check on the incoming email"},"action_prompt":{"type":"string","description":"What to do when the condition matches"},"debounce_seconds":{"type":"integer","description":"0=immediate (default for email), >0=batch"},"episode_id":{"type":"string","format":"uuid","description":"Parent episode for context"}},"required":["from_addresses","gate_prompt","action_prompt"],"additionalProperties":false}}]}'
