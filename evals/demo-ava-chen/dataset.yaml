t"],"additionalProperties":false}},{"name":"email.send","description":"Send a new email to a recipient. Subject and body required. Optionally attach files by entity ID.","params":{"type":"object","properties":{"to":{"type":"string","description":"Recipient email address"},"subject":{"type":"string"},"body_text":{"type":"string"},"attachment_ids":{"type":"array","items":{"type":"string","format":"uuid"},"description":"File entity IDs to attach"}},"required":["to","subject","body_text"],"additionalProperties":false}},{"name":"email.set_trigger","description":"Set up an automated reaction to incoming emails. Watches one or more email addresses (OR-matching). When any watched address receives an email matching the gate, the action runs.","params":{"type":"object","properties":{"from_addresses":{"type":"array","items":{"type":"string"},"description":"Email addresses to watch (OR-matching: fires for ANY)"},"from_address":{"type":"string","description":"Single address (legacy; prefer from_addresses)"},"gate_prompt":{"type":"string","description":"Condition to check on the incoming email"},"action_prompt":{"type":"string","description":"What to do when the condition matches"},"debounce_seconds":{"type":"integer","description":"0=immediate (default for email), >0=batch"},"episode_id":{"type":"string","format":"uuid","description":"Parent episode for context"}},"required":["from_addresses","gate_prompt","action_prompt"],"additionalProperties":false}}]}'
