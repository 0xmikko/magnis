# Cargo configuration for the desktop shell crate.
#
# The PostgreSQL version pin lives here and nowhere else (CON-8).
#
# `postgresql_embedded`'s build script embeds the PostgreSQL archive at COMPILE
# time. With no exact version it resolves "latest" over the network, ignores the
# pre-seeded cache, and fails on a machine without egress — observed directly:
#
#     PostgreSQL version: *
#     Error: Request failed after 3 retries
#
# `bundle-embedded-pg.sh` used to set the pin inline on its own `cargo`
# invocation, which was enough while that script did the building. It is not
# enough now: `beforeBuildCommand` runs in a SEPARATE process from the
# `cargo tauri build` that compiles this crate, so a pin exported there never
# reaches the compile that needs it. `[env]` here applies to every cargo
# invocation for this crate — `check`, `test`, `build`, and the one Tauri runs —
# which is the only placement that covers all of them.
#
# Keep this in step with `PG_VERSION` in `desktop/build/bundle-embedded-pg.sh`:
# the script seeds `~/.theseus/postgresql/postgresql-<version>-<target>.tar.gz`,
# and the build script only reuses that file when the requested version matches
# it exactly.
[env]
POSTGRESQL_VERSION = "=16.13.0"
