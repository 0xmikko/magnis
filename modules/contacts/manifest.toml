# contacts — Contacts domain module (V8 plugin).
#
# Owns the `contacts.*` namespace: the person entity and its profile / email /
# phone / social / telegram-identity / description / memory records — the core
# people directory. Links people to companies (reads companies.company); the
# address book cards a person reaches over `identity` show on its card.
# Sandboxed V8 isolate; bundled with the app and installed
# automatically at boot.

id = "contacts"
version = "0.1.0"
# SDK contract version this manifest targets (host accepts 0.x).
magnis_api_version = "0.1.0"
title = "Contacts"
summary = "People from every source, merged into one identity."
# Reverse-domain publisher identity.
publisher = "ai.magnis"

# Foreign asks beyond the implicit own namespace: writes to `contacts.` records,
# own:own links, and reads of own schemas need no declaration.
[permissions]
read = [ "companies.company" ]
links = [ "identity" ]
