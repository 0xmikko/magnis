# triggers — Trigger definitions domain module (V8 plugin).
#
# Owns the `triggers.*` graph namespace: the trigger entity plus its config and
# execution records. This module owns only the trigger DEFINITION CRUD + UI — the
# native trigger ENGINE (evaluate + fire) stays in Core and reads these
# definitions (hybrid split). Runs as a sandboxed V8 isolate; bundled with the
# app and installed automatically at boot.

id = "triggers"
version = "0.1.0"
# Plugin API version this manifest targets; the host accepts exactly 0.2.0.
magnis_api_version = "0.3.0"
# tier = "system": mandatory, always-loaded, cannot be uninstalled/disabled.
# Still V8-sandboxed.
tier = "system"
title = "Triggers"
summary = "Automations that watch your graph and act on changes."
# Reverse-domain publisher identity.
publisher = "ai.magnis"
resources = [ "triggers.trigger.history" ]

# Foreign asks beyond the implicit own namespace: writes to `triggers.` records,
# own:own links, and reads of own schemas need no declaration.
[permissions]
read = [ "episodes.episode" ]
# Shared membership requires an explicit host-kind write permission.
links = [ "watches", "belongs_to" ]
call = [ "triggers.validate_watch", "triggers.resolve_watchable", "triggers.invalidate_cache", "triggers.fire_history", "triggers.validate_schedule", "triggers.fire_now", "email.ensure_addresses", "telegram.chats.get" ]

# The host kind this module uses: a trigger belongs to a parent episode.
[[links]]
kind = "belongs_to"
from = "triggers.trigger"
to = "episodes.episode"
