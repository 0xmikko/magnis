# mock-telegram — controllable external Magnis MCP source connector.
#
# A dataset/eval-grade mock of a Telegram server. Manifest-declared actions
# produce canonical telegram envelopes that the in-plugin module ingests
# unchanged. Dataset actions emit `live` events so trigger behavior uses the
# same source -> module path as production.
#
# The server is `src/main.ts` on @magnis/connector-sdk, spawned by convention
# (bun, with this manifest's directory as the spawn cwd).
# kind = "mock" → loaded only when explicitly listed in ENABLED_SOURCES.

id = "mock-telegram"
version = "1.0.0"
title = "Mock Telegram"
summary = "Dataset-driven mock Telegram source for evals and e2e."
publisher = "ai.magnis"
dev = true
surfaces = ["telegram"]
kind = "mock"
account_mode = "single"
accounts = ["eval"]

[sync]
mode = "poll"

[dataset]
export_settings = []

[[dataset.actions]]
name = "emit_chat"
schema = "schemas/dataset-actions/emit-chat.json"

[[dataset.actions]]
name = "emit_message"
schema = "schemas/dataset-actions/emit-message.json"
