# local — local-filesystem notes source (external MCP connector).
#
# RETIRED SYNC: the notes module is now a V8 plugin (graph-only) that declares
# NO sync handler, so the `notes` surface has no module consumer. The `[sync]`
# block was removed so the host builds NO source runtime for this connector —
# otherwise a stale `local`/`notes` sync would hard-fail at module routing
# ("no module for surface"). `surfaces` stays non-empty so manifest validation
# still passes. The connector itself is kept; it is simply never synced.
#
# The server is `src/main.ts` on @magnis/connector-sdk, spawned by convention
# (bun, with this manifest's directory as the spawn cwd).
# env injected by the operator / launch scripts:
#   NOTES_DIR = "<storage>/notes"   # optional, defaults to $STORAGE_DIR/notes

id = "local"
version = "1.0.0"
title = "Local Notes"
summary = "Local-filesystem markdown notes connector (retired sync; kept as reference)."
publisher = "ai.magnis"
dev = true
surfaces = ["notes"]
kind = "core"

[certification]
disposition = "admissible"
protocol = "magnis.source/1"
authority = "module_sync"
release_tier = "development_fixture"
delivery = "poll"
poll_interval_secs = 60
server_info_version = "0.1.0"
server_info_name = "magnis-local"
runtime_kind = "connector_sdk"
runtime_version = "0.1.0"
advertised_tools = ["magnis.sync.fetch"]
callable_operations = ["initialize", "magnis.sync.fetch", "tools/list"]
scenario_ids = ["tst_conn_local_ts_001", "tst_conn_local_ts_005"]

[certification.account_compatibility]
auth = "none"
identity_rule = "local_storage_root"
credential_keys = []
minted_credential_keys = []
migrates_from = []

[[certification.account_compatibility.surfaces]]
name = "notes"
cursor_terminal_null = "retain"
progress = { target = "forward_and_backfill", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "range", live_fence = "none" }
receiver_interface_hash = "sha256:857a78797ed1d202c18506e350b0cbeac5fa5bf1f699e1a11a77814e96fc4a07"
