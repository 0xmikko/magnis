# google — Gmail + Google Calendar + Google Contacts source (TypeScript).
#
# Ported faithfully from the former Rust `google` connector (itself a
# port of the in-backend `backend/src/sources/google` source). Feeds three
# surfaces (email + meetings + contacts) with canonical envelopes the
# corresponding modules ingest unchanged — wire parity with the Rust connector
# is the invariant (the host must not tell the difference).
#
# The connector does OAuth itself: the host injects
# `_meta = { refresh_token, client_id, client_secret }` on every tool call, the
# connector refreshes an access token and calls the Gmail / Calendar REST API.
# Account discovery is host-side; no static accounts.
#
# For isolated e2e (no live Google), set GOOGLE_FIXTURE_FILE to a JSON fixture;
# the connector then serves fetch from the file with NO network and NO OAuth.
# (env is injected by the operator / launch scripts — real mode needs none;
# creds arrive per-call via `_meta`.)

id = "google"
version = "1.0.0"
title = "Google"
summary = "Sync Gmail and Google Calendar into your personal graph."
publisher = "ai.magnis"
surfaces = ["email", "meetings", "contacts"]

# OAuth2: the HOST owns the ceremony (state/PKCE-S256/nonce/consent URL) using
# the scopes below + a fixed redirect `/auth/sources/google/callback`; the
# connector only runs `magnis.auth.exchange` (code→token + id_token validation).
# `client_id`/`client_secret` come from env `SOURCE_GOOGLE_CLIENT_ID` /
# `SOURCE_GOOGLE_CLIENT_SECRET` (server) — client secrets never reach the
# browser or the plugin isolate. The browser screen is `auth/index.tsx`
# (convention). See docs/plugins/source.md for the auth model.
[auth]
type = "oauth2"

[auth.oauth2]
auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
# Must match what the Gmail/Calendar/Contacts surfaces need at sync time.
scopes = [
  "openid",
  "email",
  "https://www.googleapis.com/auth/gmail.readonly",
  "https://www.googleapis.com/auth/gmail.send",
  "https://www.googleapis.com/auth/calendar.readonly",
  "https://www.googleapis.com/auth/contacts.readonly",
]

[credentials]
keys = ["refresh_token", "client_id", "client_secret"]
minted = ["refresh_token"]

[sync]
mode = "poll"

[certification]
disposition = "admissible"
protocol = "magnis.source/1"
authority = "module_sync"
release_tier = "production"
delivery = "poll"
poll_interval_secs = 30
server_info_version = "1.0.0"
server_info_name = "magnis-google"
runtime_kind = "connector_sdk"
runtime_version = "0.1.0"
advertised_tools = ["magnis.sync.fetch"]
callable_operations = ["initialize", "magnis.auth.exchange", "magnis.auth.revoke", "magnis.execute:download_file", "magnis.execute:send_message", "magnis.sync.fetch", "tools/list"]
scenario_ids = ["tst_gts_email_009", "tst_gts_fx_001", "tst_gts_fx_003", "tst_gts_gcal_005", "tst_gts_gp_005", "tst_gts_gp_006", "tst_gts_hist_008b", "tst_gts_oidc_004", "tst_gts_oidc_007", "tst_gts_wire_006"]

[certification.account_compatibility]
auth = "oauth2"
identity_rule = "verified_google_subject"
credential_keys = ["client_id", "client_secret", "refresh_token"]
minted_credential_keys = ["refresh_token"]
migrates_from = []

[[certification.account_compatibility.surfaces]]
name = "contacts"
cursor_terminal_null = "clear"
progress = { target = "full_snapshot", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "snapshot", live_fence = "none" }
receiver_interface_hash = "sha256:eaf8d476b7dfb12ceb729da8a36bbd52d3ec3fdc684837d06e4a81586a8acdcb"

[[certification.account_compatibility.surfaces]]
name = "email"
cursor_terminal_null = "retain"
progress = { target = "forward_and_backfill", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "range", live_fence = "none" }
receiver_interface_hash = "sha256:0d6480cd0a2d5bd3960e1ec902c825a73203e76aa0ef576a37836759acc9c193"

[[certification.account_compatibility.surfaces]]
name = "meetings"
cursor_terminal_null = "clear"
progress = { target = "bounded_window", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "range", live_fence = "none" }
receiver_interface_hash = "sha256:ee62dc20e251dd38db87444858ca3dd1a1cd376af9a1cf8640684aa482984d2b"
