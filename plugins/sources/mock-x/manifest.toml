# mock-x — X fixture connector (SourceKind Mock; loaded ONLY when ENABLED_SOURCES
# lists it). No network, no credentials — feeds the `x` surface with the
# same envelope shape as the live `x` connector, keeping tests and e2e
# hermetic. Read-only: the only tool is magnis.sync.fetch.

id = "mock-x"
version = "1.0.0"
title = "Mock X"
summary = "X fixture source for tests and e2e."
publisher = "ai.magnis"
dev = true
surfaces = ["x"]
kind = "mock"
account_mode = "single"
accounts = ["default"]

[sync]
mode = "poll"

[certification]
disposition = "admissible"
protocol = "magnis.source/1"
authority = "module_sync"
release_tier = "development_fixture"
delivery = "poll"
poll_interval_secs = 5
server_info_version = "0.1.0"
server_info_name = "mock-x"
runtime_kind = "connector_sdk"
runtime_version = "0.1.0"
advertised_tools = ["magnis.sync.fetch"]
callable_operations = ["initialize", "magnis.auth.probe", "magnis.sync.fetch", "tools/list"]
scenario_ids = ["tst_cat_src_parity_001", "tst_mockx_001", "tst_mockx_003", "tst_mockx_cert_001"]

[certification.account_compatibility]
auth = "none"
identity_rule = "manifest_account_subject"
credential_keys = []
minted_credential_keys = []
migrates_from = []

[[certification.account_compatibility.surfaces]]
name = "x"
cursor_terminal_null = "retain"
progress = { target = "forward_and_backfill", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "tracked_identity_set", live_fence = "none" }
receiver_interface_hash = "sha256:57be086241360fedb370e6e10de72205ec440ec9546dff534f86933d650f09d6"
