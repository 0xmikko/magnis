# StateMock 'oauth' — the shared @magnis/source-statemachine connector (bun) in
# an oauth2/poll shape, exercising the OAuth auth ceremony and poll sync
# end-to-end in tests. Eval-only (kind=mock).

id = "mock-statemachine-oauth"
version = "1.0.0"
title = "StateMock (OAuth)"
summary = "Shared state-machine mock connector in an oauth2/poll shape."
publisher = "ai.magnis"
dev = true
surfaces = ["smo-a", "smo-b", "smo-c"]
kind = "mock"
account_mode = "single"

[auth]
type = "oauth2"

# The package-local wrapper fixes surfaces/mode before bundling. The installed
# artifact therefore executes only its own root-local dependency-closed entry.
[spawn]
command = "bun"
args = ["run", "dist/main.js"]

[sync]
mode = "poll"

[certification]
disposition = "admissible"
protocol = "magnis.source/1"
authority = "module_sync"
release_tier = "development_fixture"
delivery = "poll"
poll_interval_secs = 300
server_info_version = "0.1.0"
server_info_name = "magnis-mock-statemachine"
runtime_kind = "connector_sdk"
runtime_version = "0.1.0"
advertised_tools = ["magnis.sync.fetch"]
callable_operations = ["initialize", "magnis.auth.probe", "magnis.sync.fetch", "tools/list"]
scenario_ids = ["tst_conn_statemock_ts_001", "tst_conn_statemock_ts_004", "tst_conn_statemock_ts_013", "tst_conn_statemock_ts_014", "tst_statemock_oauth_cert_001"]

[certification.account_compatibility]
auth = "oauth2"
identity_rule = "verified_provider_subject"
credential_keys = ["refresh_token"]
minted_credential_keys = ["refresh_token"]
migrates_from = []

[[certification.account_compatibility.surfaces]]
name = "smo-a"
cursor_terminal_null = "retain"
progress = { target = "programmable_fixture", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "unknown", live_fence = "none" }
receiver_interface_hash = "sha256:f2b5524f212b9a9348fba847f64c2923f4f9d03d21e21e9f18e1b96228cab369"

[[certification.account_compatibility.surfaces]]
name = "smo-b"
cursor_terminal_null = "retain"
progress = { target = "programmable_fixture", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "unknown", live_fence = "none" }
receiver_interface_hash = "sha256:52758c92b7b75066133ae5f70109433d8da2a61c810e9cd04111eb30ad72b556"

[[certification.account_compatibility.surfaces]]
name = "smo-c"
cursor_terminal_null = "retain"
progress = { target = "programmable_fixture", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "unknown", live_fence = "none" }
