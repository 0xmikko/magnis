# mock-gmail — the reference external Magnis MCP source connector.
#
# The first source migrated out of the backend into the external-MCP format.
# Feeds two surfaces (email + meetings) with the same canonical envelopes the
# in-core mock did, so the emails/meetings modules ingest it unchanged.
#
# The server is `src/main.ts` on @magnis/connector-sdk, spawned by convention
# (bun, with this manifest's directory as the spawn cwd). Test events enter
# only through the manifest-declared dataset action below.

id = "mock-gmail"
version = "1.0.0"
title = "Mock Gmail"
summary = "Dataset-driven mock email + meetings source for evals and e2e."
publisher = "ai.magnis"
dev = true
surfaces = ["email", "meetings"]
kind = "mock"
account_mode = "single"
accounts = ["eval"]

[sync]
mode = "poll"

[dataset]
export_settings = []

[[dataset.actions]]
name = "emit_message"
schema = "schemas/dataset-actions/emit-message.json"

[[dataset.actions]]
name = "emit_meeting"
schema = "schemas/dataset-actions/emit-meeting.json"

[certification]
disposition = "admissible"
protocol = "magnis.source/1"
authority = "module_sync"
release_tier = "development_fixture"
delivery = "poll"
poll_interval_secs = 5
server_info_version = "0.1.0"
server_info_name = "magnis-mock-gmail"
runtime_kind = "connector_sdk"
runtime_version = "0.1.0"
advertised_tools = ["magnis.dataset.invoke", "magnis.sync.fetch"]
callable_operations = ["initialize", "magnis.dataset.invoke:emit_meeting", "magnis.dataset.invoke:emit_message", "magnis.execute:send_message", "magnis.sync.fetch", "tools/list"]
scenario_ids = ["tst_conn_mockgmail_dataset_001", "tst_conn_mockgmail_dataset_003", "tst_conn_mockgmail_ts_001"]

[certification.account_compatibility]
auth = "none"
identity_rule = "manifest_account_subject"
credential_keys = []
minted_credential_keys = []
migrates_from = []

[[certification.account_compatibility.surfaces]]
name = "email"
cursor_terminal_null = "retain"
progress = { target = "forward_and_backfill", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "range", live_fence = "none" }
receiver_interface_hash = "sha256:0d6480cd0a2d5bd3960e1ec902c825a73203e76aa0ef576a37836759acc9c193"

[[certification.account_compatibility.surfaces]]
name = "meetings"
cursor_terminal_null = "clear"
progress = { target = "bounded_window", continuation = "opaque_cursor", forward_checkpoint = "opaque_cursor", coverage = "range", live_fence = "none" }
receiver_interface_hash = "sha256:ee62dc20e251dd38db87444858ca3dd1a1cd376af9a1cf8640684aa482984d2b"
