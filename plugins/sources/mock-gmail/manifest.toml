# mock-gmail — the reference external Magnis MCP source connector.
#
# The first source migrated out of the backend into the external-MCP format.
# Feeds two surfaces (email + meetings) with the same canonical envelopes the
# in-core mock did, so the emails/meetings modules ingest it unchanged.
#
# The server is `src/main.ts` on @magnis/connector-sdk, spawned by convention
# (bun, with this manifest's directory as the spawn cwd). Test events enter
# only through the manifest-declared dataset action below.

id = "mock-gmail"
version = "1.0.0"
title = "Mock Gmail"
summary = "Dataset-driven mock email + meetings source for evals and e2e."
publisher = "ai.magnis"
dev = true
surfaces = ["email", "meetings"]
kind = "mock"
account_mode = "single"
accounts = ["eval"]

[sync]
mode = "poll"

[dataset]
export_settings = []

[[dataset.actions]]
name = "emit_message"
schema = "schemas/dataset-actions/emit-message.json"

[[dataset.actions]]
name = "emit_meeting"
schema = "schemas/dataset-actions/emit-meeting.json"
