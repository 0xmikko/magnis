# The modules every new workspace installs by default.
#
# This is the one hand-written list in the catalog, and it is deliberately
# short: what a package needs is its own `dependsOn`, and which modules a
# picked source brings is that source's `dependsOn`; a copy here would be a
# second truth that drifts. System modules (`tier = "system"`) install on
# every workspace and need no entry.
#
# The builder publishes it as `onboarding.json` version 2.

modules = ["projects", "companies"]
