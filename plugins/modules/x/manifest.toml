# x — X (Twitter) domain module (V8 plugin).
#
# Owns the `x.*` graph namespace: profile + post entities and their
# dictionaries for the X accounts you track. Ingests the `x` sync surface fed
# by the X source connector, joins each profile to the matching contact with an
# `identity` edge (reads contacts.person), and reads contacts' social-tracking
# over RPC. Read-only today.
# Sandboxed V8 isolate; presence-seeded at boot.

id = "x"
version = "0.1.0"
# SDK contract version this manifest targets (host accepts 0.x).
magnis_api_version = "0.1.0"
title = "X"
summary = "X (Twitter) profiles and posts of the people you track, linked to contacts."
# Reverse-domain publisher identity.
publisher = "ai.magnis"

[[links]]
kind = "x.post:x.profile"
from = "x.post"
to = "x.profile"

[[links]]
kind = "x.profile:contacts.person"
from = "x.profile"
to = "contacts.person"

# Sync surface this module consumes (fed by the matching source connector).
[surfaces.x]
reconciliation = { mode = "none" }

# Foreign asks beyond the implicit own namespace: writes to `x.` records,
# own:own links, and reads of own schemas need no declaration.
[permissions]
read = [ "contacts.person" ]
links = [ "authored_by", "identity" ]
call = [ "contacts.get_social_tracking_by_handle", "contacts.rename_if_placeholder", "source.sync.bootstrap" ]
host = [ "external_id_reads" ]

# S5: this module owns no link kinds. Authorship and identity are host-owned
# RELATIONS (backend/src/services/graph/link_kinds.rs), constrained by the
# endpoint ROLES its own descriptors declare.
